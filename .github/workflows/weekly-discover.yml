name: Weekly Skill Discovery

on:
  schedule:
    - cron: "0 14 * * 0"  # Sunday 2 PM UTC
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check for existing open recommendation issue
        id: existing
        run: |
          open=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --label "skill-recommendation" \
            --state open \
            --json number --jq 'length')
          echo "open=$open" >> "$GITHUB_OUTPUT"
          if [ "$open" -gt 0 ]; then
            echo "Open recommendation issue already exists — skipping."
          fi

      - name: Run shared discovery pipeline
        if: steps.existing.outputs.open == '0'
        run: |
          bash skills/ss-skill-discover/scripts/discover.sh \
            --profile .github/user-profile.md \
            --limit 10 \
            --installed-dir skills \
            --exclude-repo "$GITHUB_REPOSITORY" \
            > /tmp/candidates.json
          echo "Candidates returned: $(jq 'length' /tmp/candidates.json)"

      - name: Ensure label exists
        if: steps.existing.outputs.open == '0'
        run: |
          gh label create "skill-recommendation" \
            --description "Automated skill recommendations" \
            --color "0e8a16" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

      - name: Build issue body and create issue
        if: steps.existing.outputs.open == '0'
        run: |
          count=$(jq 'length' /tmp/candidates.json)
          if [ "$count" -eq 0 ]; then
            echo "No new skills found — not opening an issue."
            exit 0
          fi

          date=$(date -u +%Y-%m-%d)
          {
            echo "## Weekly Skill Recommendations — $date"
            echo
            echo "Check the skills you want, then comment \`@claude install the checked skills from this issue\`."
            echo
            jq -r '.[] |
              "- [ ] **\(.name)** | [\(.repo)](https://github.com/\(.repo)) | \(.stars) stars | Updated \(.age_label)\n  > \(.description)\n"
            ' /tmp/candidates.json
            echo "---"
            echo "*Auto-generated by ssm-skill-weekly-discover. Pipeline: \`skills/ss-skill-discover/scripts/discover.sh\`.*"
          } > /tmp/body.md

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Weekly Skill Recommendations — $date" \
            --label "skill-recommendation" \
            --body-file /tmp/body.md
